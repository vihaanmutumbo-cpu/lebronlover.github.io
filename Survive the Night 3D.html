 if(e.repeat||st!=='play')return;if(k===KB.g)throwG();if(k===KB.fl)flare();if(k===KB.tp){TP=!TP;S.tp=TP;save()}if(k===KB.ab)useAbility();if(k===KB.jmp&&P.y<=GF+.02&&!downed)P.vy=6.2;if(k===KB.bm)BM=!BM;if(k===KB.bt)bi=(bi+1)%PIECES.length;if(k===KB.rot)BR++;
 if(SB&&e.altKey){if(k==='q')spawn();if(k==='b')spawn('boss');if(k==='t')auto=!auto;if(k==='h')god=!god;if(k==='c')clearZ();if(k==='n'){night++;news(night)}if(k==='u')UPG[Math.random()*UPG.length|0].f()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
R.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'){if(e.clientX<innerWidth/2){joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0}}else{lookId=e.pointerId;lx=e.clientX;ly=e.clientY;fireHeld=true}}
 else if(e.button===0){if(st==='play'&&!locked)lockPtr();fireHeld=locked||fireHeld}});
addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'){if(joy&&e.pointerId===joy.id){joy.dx=(e.clientX-joy.ox)/50;joy.dy=(e.clientY-joy.oy)/50}
  if(e.pointerId===lookId){yaw-=(e.clientX-lx)*SENS()*2.7;pitch-=(e.clientY-ly)*SENS()*2.7*(S.inv?-1:1);lx=e.clientX;ly=e.clientY}}
 else if(locked||(e.buttons&1&&!locked)){yaw-=e.movementX*SENS();pitch-=e.movementY*SENS()*(S.inv?-1:1)}});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){if(joy&&e.pointerId===joy.id)joy=null;if(e.pointerId===lookId){lookId=null;fireHeld=false}}else fireHeld=false});
R.domElement.addEventListener('mousedown',e=>{if(e.button===0&&locked)fireHeld=true});
menu();requestAnimationFrame(loop);
</script>
</body>
