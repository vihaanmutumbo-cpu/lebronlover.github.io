<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survive the Night 3D</title>
<style>
:root{--card:#fff;--fg:#1f2a1a;--accent:#d9480f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#26301f;--fg:#e4edd9;--accent:#ff8a3d}}
:root[data-theme="dark"]{--card:#26301f;--fg:#e4edd9;--accent:#ff8a3d}
html,body{margin:0;height:100%;overflow:hidden;background:#05070a;touch-action:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block}
#hud *{position:fixed;pointer-events:none;color:#fff;text-shadow:0 0 5px #000}
#hp{left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:170px;height:12px;background:#0009;border:1px solid #fff5}
#hp i{display:block;height:100%;background:#c0392b;width:100%;position:static}
#ammo{right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font:700 28px system-ui}
#top{top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:700 15px system-ui}
#cx{left:50%;top:50%;transform:translate(-50%,-50%);font:300 28px system-ui}
#hm{left:50%;top:50%;transform:translate(-50%,-50%);font:700 24px system-ui;opacity:0}
#dmg{inset:0;box-shadow:inset 0 0 120px 40px rgba(200,0,0,.85);opacity:0}
#ov{position:fixed;inset:0;background:rgba(8,12,6,.86);color:#f1f6ea;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px;text-align:center;overflow-y:auto}
#ov>*{max-width:340px;width:100%;box-sizing:border-box}
#ov h1{margin:0;font-size:28px}#ov p{margin:0;font-size:14px;opacity:.85}
.btn{background:var(--card);color:var(--fg);border:2px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn small{display:block;font-weight:400;opacity:.7;font-size:12px}
.go{background:var(--accent);color:#fff;border:0}.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sv{left:14px;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:170px;height:10px;background:#0009;border:1px solid #fff5}#sv i{display:block;height:100%;background:#4aa8ff;position:static}
#svt{left:14px;bottom:calc(50px + env(safe-area-inset-bottom,0px));font:600 13px system-ui}
#team{left:14px;top:calc(40px + env(safe-area-inset-top,0px));font:600 13px system-ui;white-space:pre-line}
#cut{position:fixed;inset:0;z-index:9;background:#000;color:#eee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-size:18px;line-height:1.4}
#cut .big{font-size:72px}#cut .ln{max-width:380px;animation:fi 1s both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#chat{display:flex;flex-direction:column;gap:8px;width:min(360px,92vw)}
.b{padding:8px 12px;border-radius:14px;font-size:15px;text-align:left;max-width:85%}.op{background:#2a4a7a;align-self:flex-start}.me{background:#2e6b3a;align-self:flex-end}
#skip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:10;background:#fff2;color:#fff;border:1px solid #fff5;border-radius:8px;padding:6px 12px}
#news{top:22%;left:0;right:0;text-align:center;font:700 22px system-ui;opacity:0;transition:opacity .6s}
#tb{position:fixed;right:12px;top:40%;display:none;flex-direction:column;gap:10px}#tb button{width:54px;height:54px;border-radius:50%;border:2px solid #fff8;background:#0007;color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div id="hp"><i></i></div><div id="top"></div><div id="ammo"></div><div id="cx">+</div><div id="hm">✕</div><div id="dmg"></div><div id="news"></div><div id="team"></div><div id="sv"><i></i></div><div id="svt"></div></div>
<div id="cut"></div><button id="skip" style="display:none">Skip ▶</button><div id="tb"><button id="bg">💣</button><button id="bf">🔥</button></div>
<div id="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),ov=$('ov');
let S={coins:0,best:0,perm:{},skins:['blue'],skin:'blue'},rc=0,best=0;
try{const o=JSON.parse(localStorage.getItem('nightsave'));if(o)S=Object.assign(S,o)}catch(e){}
best=S.best;const save=()=>{try{localStorage.setItem('nightsave',JSON.stringify(S))}catch(e){}};
const lv=k=>S.perm[k]||0;
const PERM=[{k:'dmg',n:'Hollow Points',d:'+10% starting damage',base:30,max:5},{k:'rate',n:'Fast Trigger',d:'+8% fire rate',base:30,max:5},{k:'hp',n:'Body Armor',d:'+15 starting HP',base:25,max:5},{k:'spd',n:'Running Shoes',d:'+4% move speed',base:25,max:5},{k:'range',n:'Scope',d:'Tighter spread, brighter light',base:25,max:5},{k:'multi',n:'Extra Barrel',d:'Start with +1 bullet',base:200,max:2}];
const SKINS=[{k:'blue',n:'Rookie',col:0x4da6ff,ring:0xffffff,cost:0},{k:'camo',n:'Camo',col:0x6b8e23,ring:0x3d4f14,cost:60},{k:'red',n:'Crimson',col:0xd62828,ring:0xffb703,cost:100},{k:'ghost',n:'Ghost',col:0xe8f1ff,ring:0x8ecae6,cost:150},{k:'gold',n:'Gold',col:0xffd166,ring:0xb8860b,cost:250},{k:'neon',n:'Neon',col:0xff4ecd,ring:0x00f5d4,cost:300}];
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const UPG=[{n:'Hollow Points',d:'+30% damage',f:()=>P.dmg*=1.3},{n:'Fast Trigger',d:'+25% fire rate',f:()=>P.rate*=1.25},{n:'Extra Barrel',d:'+1 bullet per shot',f:()=>P.multi++},{n:'Running Shoes',d:'+12% move speed',f:()=>P.spd*=1.12},{n:'Body Armor',d:'+30 max HP, full heal',f:()=>{P.max+=30;P.hp=P.max}},{n:'Scope',d:'Tighter spread, brighter light',f:()=>{P.spread*=.75;fl.distance*=1.2}},{n:'Med Kit',d:'Heal to full',f:()=>P.hp=P.max},{n:'Frag Rounds',d:'Bullets pierce 1 more',f:()=>P.pierce++},
{n:'Extended Mag',d:'+10 magazine size',f:()=>{P.mag+=10;P.ammo=P.mag}},{n:'Speed Loader',d:'25% faster reloads',f:()=>P.rt*=.75},{n:'Kevlar Vest',d:'Take 20% less damage',f:()=>P.red*=.8},{n:'Regeneration',d:'+1 HP per second',f:()=>P.regen++},{n:'Bloodthirst',d:'Heal 2 HP per kill',f:()=>P.vamp+=2},{n:'Headhunter',d:'Headshots do +1.5× more',f:()=>P.hs+=1.5},{n:'Grenadier',d:'+3 grenades, bigger blasts',f:()=>{P.gr+=3;P.nr*=1.25}},{n:'Flare Pack',d:'+3 flares',f:()=>P.fr+=3},{n:'Survival Kit',d:'Refill survival meter, slower drain',f:()=>{P.sv=100;P.dr*=.8}}];

// ---- three.js setup
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x05070a);sc.fog=new THREE.FogExp2(0x05070a,.05);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);sc.add(cam);
const amb=new THREE.AmbientLight(0x3a4560,.7);sc.add(amb);const moon=new THREE.DirectionalLight(0x6070a0,.5);moon.position.set(10,30,10);sc.add(moon);
const fl=new THREE.SpotLight(0xfff2d0,2.2,45,.5,.5,1);cam.add(fl);const ft=new THREE.Object3D();ft.position.set(0,0,-10);cam.add(ft);fl.target=ft;
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const BX=new THREE.BoxGeometry(1,1,1),mats={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c,emissive:new THREE.Color(c).multiplyScalar(.22)}));
function box(par,w,h,d,c,x,y,z){const m=new THREE.Mesh(BX,mat(c));m.scale.set(w,h,d);m.position.set(x,y,z);par.add(m);return m}
// ground
const tc=document.createElement('canvas');tc.width=tc.height=256;{const g=tc.getContext('2d'),N=256;g.fillStyle='#2a3322';g.fillRect(0,0,N,N);
 const w=(f)=>{for(const a of[-N,0,N])for(const b of[-N,0,N])f(a,b)};
 for(let i=0;i<120;i++){const x=Math.random()*N,y=Math.random()*N,r=5+Math.random()*20;g.fillStyle='rgba('+(30+Math.random()*40|0)+','+(40+Math.random()*40|0)+',20,.4)';w((a,b)=>{g.beginPath();g.arc(x+a,y+b,r,0,7);g.fill()})}
 for(let i=0;i<500;i++){const x=Math.random()*N,y=Math.random()*N;g.fillStyle=Math.random()<.5?'rgba(0,0,0,.3)':'rgba(120,140,80,.2)';w((a,b)=>g.fillRect(x+a,y+b,2,3))}}
const tex=new THREE.CanvasTexture(tc);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(48,48);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshLambertMaterial({map:tex}));ground.rotation.x=-Math.PI/2;sc.add(ground);
// scenery repeats forever around the player
const PER=140,deco=[];
for(let i=0;i<90;i++){const g=new THREE.Group(),r=Math.random();
 if(r<.5){box(g,.35,4,.35,0x2b2118,0,2,0);box(g,2,.2,.2,0x2b2118,.8,3,0);box(g,1.4,.2,.2,0x2b2118,-.6,2.4,0)}
 else if(r<.8){const s=.6+Math.random()*1.4;box(g,s*1.4,s,s,0x4a4d52,0,s/2,0);g.rotation.y=Math.random()*3}
 else{box(g,1.2,1.2,1.2,0x5a4426,0,.6,0);g.rotation.y=Math.random()*3}
 deco.push({g,ox:Math.random()*PER,oz:Math.random()*PER});sc.add(g)}
// viewmodel
const gun=new THREE.Group();cam.add(gun);gun.position.set(.22,-.22,-.45);
box(gun,.07,.09,.55,0x222222,0,0,0);box(gun,.025,.025,.3,0x111111,0,.01,-.4);box(gun,.06,.1,.2,0x1a1a1a,0,-.02,.35);
const rail=box(gun,.05,.02,.4,0xffffff,0,.055,0),mag=box(gun,.05,.16,.08,0xffffff,0,-.12,-.05);box(gun,.07,.07,.25,0xd8b08c,0,-.07,-.25);
const mfm=new THREE.Mesh(BX,new THREE.MeshBasicMaterial({color:0xffe28a}));mfm.scale.set(.1,.1,.12);mfm.position.set(0,.01,-.6);mfm.visible=false;gun.add(mfm);
const mfl=new THREE.PointLight(0xffc060,0,10);mfl.position.set(0,0,-.7);gun.add(mfl);
function skin(){const s=SKINS.find(k=>k.k===S.skin)||SKINS[0];rail.material=new THREE.MeshLambertMaterial({color:s.col});mag.material=new THREE.MeshLambertMaterial({color:s.ring})}

// ---- game state
let P,Z=[],fx=[],tr=[],PK=[],GR=[],FLR=[],heli=null,SB=false,flash=0,stT=8,auto=false,god=false,newsT=0,cutId=0,END=false,kc=0,DB=null,UID=null,st='menu',night=0,left=0,spT=0,bT=0,yaw=0,pitch=0,locked=false,lockOK=false,fireHeld=false,joy=null,lookId=null,lx=0,ly=0,keys={},recoil=0,mfT=0,shk=0,hmT=0,tm=0,bob=0;
const rcast=new THREE.Raycaster(),lm=new THREE.LineBasicMaterial({color:0xffe6a0}),bm=mat(0x7a0d0d);
let AC;function snd(k){try{AC=AC||new AudioContext();const n=k==1?3000:6000,b=AC.createBuffer(1,n,44100),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,k==1?3:2);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=k==1?.25:.4;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
function lockPtr(){try{R.domElement.requestPointerLock()}catch(e){}}
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===R.domElement;if(locked)lockOK=true;
 if(!locked&&lockOK&&st==='play'){st='pause';ov.style.display='flex';ov.innerHTML='<h1>Paused</h1>';const b=document.createElement('button');b.className='btn go';b.textContent='Resume';b.onclick=()=>{st='play';ov.style.display='none';lockPtr()};ov.appendChild(b)}});

function newGame(sb,en,mp){SB=!!sb;END=!!en;MP=!!mp;downed=false;downT=0;kc=0;auto=false;applyWorld();god=SB;rc=0;skin();const h=100+15*lv('hp');
 P={x:0,z:0,hp:h,max:h,spd:5.5*(1+.04*lv('spd')),dmg:1+.1*lv('dmg'),rate:1+.08*lv('rate'),multi:1+lv('multi'),pierce:0,spread:Math.pow(.92,lv('range')),cd:0,ammo:30,mag:30,rt:2.1,red:1,regen:0,vamp:0,hs:2.5,nr:1,dr:1,sv:100,rl:0,hit:0};
 fl.distance=60*(1+.08*lv('range'));night=SB?4:0;P.gr=3;P.fr=3;yaw=pitch=0;startNight()}
function clearZ(){for(const g of Z)sc.remove(g);Z=[];for(const p of PK)sc.remove(p.m);PK=[];for(const g of GR)sc.remove(g.m);GR=[];for(const f of FLR)sc.remove(f.l);FLR=[];for(const s of SP)sc.remove(s.m);SP=[];for(const m of SVP)sc.remove(m);SVP=[];if(heli){sc.remove(heli.g);sc.remove(heli.bc);heli=null}}
function startNight(){night++;clearZ();P.ammo=P.mag;P.rl=0;P.gr=Math.max(P.gr,3);P.fr=Math.max(P.fr,3);P.sv=Math.min(100,(P.sv||0)+30);sc.fog.density=(.024+Math.min(night,10)*.0025+(has(13)?.012:0))*DF.fog*(WD.fm||1);
 if(night%5===0&&!SB)spawn('boss');
 left=SB?1e9:night===15&&!END?80:Math.min(60,25+night*4);spT=bT=0;st='play';ov.style.display='none';news(night);$('tb').style.display=matchMedia('(pointer:coarse)').matches?'flex':'none';lockPtr()}
function addZ(t,x,z){const g=new THREE.Group(),sk=t.skin;
 box(g,.6,.8,.35,t.col,0,1.2,0);const hd=box(g,.34,.34,.34,sk,0,1.78,0);hd.userData.h=1;
 box(g,.14,.14,.7,sk,-.4,1.5,.3);box(g,.14,.14,.7,sk,.4,1.5,.3);box(g,.06,.05,.02,0xff2200,-.08,1.8,.18);box(g,.06,.05,.02,0xff2200,.08,1.8,.18);
 const ll=box(g,.2,.8,.2,0x2a2a35,-.17,.4,0),rl=box(g,.2,.8,.2,0x2a2a35,.17,.4,0);
 g.children.forEach(m=>m.userData.z=g);g.scale.setScalar(t.s);g.position.set(x,0,z);
 g.userData={hp:t.hp,sp:t.sp*DF.sp,dmg:t.dmg,s:t.s,c:t.c,x:t.x,r:t.r,ch:t.ch,sp2:t.sp2,sh:2,ll,rl,ph:Math.random()*6,cd:0};Z.push(g);sc.add(g)}
function spawnBase(f){const r=Math.random(),k=(1+night*.3)*DF.hp,a=Math.random()*6.283;
 const T={walk:{hp:3*k,sp:.8+night*.04,dmg:6,s:1,col:0x5b7f45,skin:0x8fa57a,c:1},run:{hp:2*k,sp:1.7+night*.04,dmg:4,s:.9,col:0xa88a2a,skin:0xb09a60,c:1},tank:{hp:14*k,sp:.55,dmg:18,s:1.5,col:0x6d3f85,skin:0x9a7ab0,c:3},crawl:{hp:2*k,sp:2.1,dmg:5,s:.55,col:0x3a4a3a,skin:0x6a7a6a,c:2},boom:{hp:3*k,sp:1.2,dmg:0,s:1,col:0xc4511a,skin:0xe08a4a,c:3,x:1},jug:{hp:22*k,sp:.6,dmg:22,s:1.35,col:0x3c4350,skin:0x8a8f99,c:6},boss:{hp:120+night*15,sp:.5,dmg:25,s:2,col:0x7a1f1f,skin:0xb06060,c:25}};
 let t=f||'walk';if(!f){if(has(11)&&r<.1)t='jug';else if(has(10)&&r<.2)t='boom';else if(has(8)&&r<.32)t='crawl';else if(has(4)&&r<.45)t='tank';else if(has(2)&&r<.62)t='run'}
 addZ(T[t],P.x+Math.cos(a)*38,P.z+Math.sin(a)*38)}
function spawnOld(){const r=Math.random(),k=1+night*.3,a=Math.random()*6.283;
 let t={hp:3*k,sp:.8+night*.04,dmg:6,s:1,col:0x5b7f45,skin:0x8fa57a,c:1};
 if(night>=2&&r<.3)t={hp:2*k,sp:1.7+night*.04,dmg:4,s:.9,col:0xa88a2a,skin:0xb09a60,c:1};
 else if(night>=4&&r<.45)t={hp:14*k,sp:.55,dmg:18,s:1.5,col:0x6d3f85,skin:0x9a7ab0,c:3};
 addZ(t,P.x+Math.cos(a)*38,P.z+Math.sin(a)*38)}
function gore(p,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(BX,bm);m.scale.setScalar(.07);m.position.copy(p);sc.add(m);fx.push({m,v:new THREE.Vector3((Math.random()-.5)*3,Math.random()*3,(Math.random()-.5)*3),t:.7})}
 while(fx.length>150){sc.remove(fx.shift().m)}}
function kill(g){const u=g.userData;if(u.dead)return;u.dead=1;sc.remove(g);Z.splice(Z.indexOf(g),1);rc+=u.c;kc++;if(P.vamp)P.hp=Math.min(P.max,P.hp+P.vamp);if(u.sp2)for(let i=0;i<2;i++)addZ({...EX.bug,hp:2,s:.6},g.position.x+i-.5,g.position.z);const p=g.position.clone().setY(1.2);gore(p,14);
 if(u.x)boom(p,5,15,30);
 if(has(3)&&Math.random()<.1)drop(0,g.position);else if(has(9)&&Math.random()<.08)drop(1,g.position)}
function hurt(d,q){if(god||downed)return;P.hp-=d*P.red*DF.dmg;if(!q){$('dmg').style.opacity=1;shk=.05;snd(2)}else $('dmg').style.opacity=.35;if(P.hp<=0){if(MP&&RM&&RM.peers().some(p=>!p.isMe&&p.presence.mp&&!p.presence.dn)){downed=true;downT=0;P.hp=0;news(0,'You’re down! A teammate can revive you…')}else over()}}
function fire(){P.cd=.16/P.rate;if(!SB)P.ammo--;shots++;recoil=.08;pitch+=.004+Math.random()*.004;yaw+=(Math.random()-.5)*.005;mfT=.05;snd(1);cam.updateMatrixWorld(true);
 for(let i=0;i<P.multi;i++){const o=(i-(P.multi-1)/2)*.03,sp=.014*P.spread;
  rcast.setFromCamera({x:o+(Math.random()-.5)*sp,y:(Math.random()-.5)*sp},cam);
  const hits=rcast.intersectObjects(Z,true),ob=rcast.intersectObjects(deco.map(d=>d.g),true),od=ob.length?ob[0].distance:1e9,seen=new Set();let end=ob.length?ob[0].point:rcast.ray.at(60,new THREE.Vector3()),n=0;
  for(const h of hits){if(h.distance>od)break;const g=h.object.userData.z;if(!g||seen.has(g))continue;seen.add(g);
   const hd=h.object.userData.h;g.userData.hp-=P.dmg*(hd?P.hs:1);g.position.addScaledVector(rcast.ray.direction,.12);gore(h.point,hd?6:3);hmT=.15;$('hm').style.color=hd?'#f33':'#fff';
   if(g.userData.hp<=0)kill(g);end=h.point;if(++n>P.pierce)break}
  const a=new THREE.Vector3(0,0,-.6);gun.localToWorld(a);const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,end]),lm);sc.add(l);tr.push({l,t:.05})}
 if(P.ammo<=0)P.rl=P.rt}

function update(dt){
 tm+=dt;left-=dt;if(left<=0){if(night===15&&!SB&&!END){if(!heli)callHeli()}else return upgrades()}
 let mx=(keys[KB.r]?1:0)-(keys[KB.l]?1:0),mz=(keys[KB.f]?1:0)-(keys[KB.b]?1:0);if(joy){mx=joy.dx;mz=-joy.dy}
 const m=Math.hypot(mx,mz);if(m>1){mx/=m;mz/=m}
 const sp=downed?0:P.spd*(keys[KB.sp]?1.4:1);
 P.x+=(-Math.sin(yaw)*mz+Math.cos(yaw)*mx)*sp*dt;P.z+=(-Math.cos(yaw)*mz-Math.sin(yaw)*mx)*sp*dt;collide(P,.45);
 bob+=m*sp*dt*1.8;pitch=Math.max(-1.4,Math.min(1.4,pitch));
 shk*=.9;recoil*=.8;
 cam.position.set(P.x,(downed?.5:1.7)+Math.sin(bob)*.04*Math.min(m,1),P.z);cam.rotation.set(pitch,yaw,(Math.random()-.5)*shk,'YXZ');
 gun.position.set(.22+Math.cos(bob*.5)*.01*m,-.22+Math.abs(Math.sin(bob))*.01*m,-.45+recoil);
 ground.position.set(P.x,0,P.z);tex.offset.set(P.x/5,-P.z/5);
 for(const d of deco){d.g.position.set(d.ox+PER*Math.round((P.x-d.ox)/PER),0,d.oz+PER*Math.round((P.z-d.oz)/PER))}
 // shooting
 P.cd-=dt;if(P.rl>0){P.rl-=dt;if(P.rl<=0){P.rl=0;P.ammo=P.mag}}
 if(keys[KB.rl]&&P.ammo<P.mag&&!P.rl)P.rl=P.rt;
 if((fireHeld||keys[' '])&&P.cd<=0&&!P.rl&&P.ammo>0&&!downed)fire();
